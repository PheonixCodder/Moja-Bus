name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Typecheck · Test · Lint Quality Gate (F-IN-05)
    runs-on: ubuntu-latest
    # Phase 01: DATABASE_URL dropped — typecheck and the unit test suites need no live DB.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Policy (Phase 01): failures newly exposed by this gate are fixed here ONLY if they
      # are test bugs; product bugs are filed into their owning remediation phase instead.

      # traveler-app included per Phase 01 D7-A probe (tsc --noEmit clean 2026-08-23).
      - name: Typecheck workspace
        run: pnpm exec turbo run typecheck

      # Blocks deploys on any failing suite, including the four suites wired in Phase 01
      # (outbox, authorize, roles-and-permissions) after D5-A consolidation.
      - name: Test workspace
        run: pnpm exec turbo run test

      # D8-A: lint runs on every deploy. Report-only for now (continue-on-error):
      # pre-existing repo-wide biome debt across ~10 packages predates this phase and is
      # tracked as a follow-up finding. Flip this step to blocking once that cleanup lands.
      - name: Lint workspace (report-only until biome debt cleared)
        run: pnpm exec turbo run lint
        continue-on-error: true

  build-and-push:
    name: Build & Push Hardened Images
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Migrate Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: |
            pheonixcodder/moja-buss-migrate:latest
            pheonixcodder/moja-buss-migrate:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL_BUILD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            pheonixcodder/moja-buss-web:latest
            pheonixcodder/moja-buss-web:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL_BUILD }}
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_PAYSTACK_CHECKOUT_MODE=${{ secrets.NEXT_PUBLIC_PAYSTACK_CHECKOUT_MODE }}
            NEXT_PUBLIC_NOVU_APP_ID=${{ secrets.NEXT_PUBLIC_NOVU_APP_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Zero-Downtime Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "==> 1. Navigating to project directory..."
            cd /moja-bus

            echo "==> 2. Syncing codebase to latest commit..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> 3. Pulling updated container images..."
            docker compose pull

            echo "==> 4. Executing pending database migrations..."
            docker compose run --rm migrate

            echo "==> 5. Reloading application containers with zero downtime..."
            docker compose up -d --remove-orphans

            echo "==> 6. Verifying application healthcheck..."
            sleep 10
            docker compose exec -T web wget -qO- http://127.0.0.1:3000/api/health || (echo "Healthcheck failed!" && exit 1)

            echo "==> 7. Pruning dangling build artifacts safely..."
            if [ -f "./deploy/maintenance/safe-cleanup.sh" ]; then
              sudo ./deploy/maintenance/safe-cleanup.sh || true
            fi

            echo "==> Deployment completed successfully!"
