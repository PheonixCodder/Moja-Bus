name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck & Quality Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_BUILD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm run typecheck

  build-and-push:
    name: Build & Push Docker Images
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: pheonixcodder/moja-buss-web:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL_BUILD }}
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=pk_live_2f22fcefc64d211e9237229c821b9e89a4e21746
            NEXT_PUBLIC_APP_URL=https://mojaride.net
            NEXT_PUBLIC_APP_NAME=Moja Ride
            NEXT_PUBLIC_PAYSTACK_CHECKOUT_MODE=inline
            NEXT_PUBLIC_NOVU_APP_ID=9mUSmj0sjBGc
            NEXT_PUBLIC_POSTHOG_KEY=phc_zJL24rdHaATKXTUd3jw65SxaZtTkqdd3i49N6H7jSz2q
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Migrate Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: pheonixcodder/moja-buss-migrate:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL_BUILD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /moja-bus
            git pull origin main
            docker compose pull
            docker compose up -d
