packages:
  - apps/*
  - packages/*

overrides:
  lightningcss: 1.30.1
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  "@expo/metro-runtime": 57.0.10
  "@expo/dom-webview": 57.0.1
  react-native-worklets: 0.10.1

autoInstallPeers: true
strictPeerDependencies: false
engineStrict: false
virtualStoreDirMaxLength: 30
confirmModulesPurge: false

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
